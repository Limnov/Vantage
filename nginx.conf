server {
    listen 5180;
    server_name localhost;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Static assets - strong cache
    # Update root path to match your deployment location
    location ~* \.(js|css|woff2|ttf|svg|ico)$ {
        root E:/Vantage-Hackathon/web/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:3004/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖客户端自带值；后端在该单层拓扑中配置 TRUST_PROXY=1。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check
    location = /health {
        proxy_pass http://127.0.0.1:3004/health;
    }

    # Frontend SPA
    location / {
        root E:/Vantage-Hackathon/web/dist;
        try_files $uri $uri/ /index.html;
        expires 1d;
    }
}
